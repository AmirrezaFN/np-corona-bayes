[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "npcb"
version = "0.1.0"
description = "Bayesian calibration of a nanoparticle-to-tumour transport model with an evolving protein corona"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib", "pymc>=5", "arviz", "numpyro", "jax", "xarray", "h5netcdf", "h5py"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
